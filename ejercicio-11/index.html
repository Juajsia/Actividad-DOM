<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 11</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <main>
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <form action="">
                        <label for="name" class="form-label">Nombre</label>
                        <input id="name" name="name" class="form-control" type="text" placeholder="Pedrito">
                        <p id="error1" class="text-danger"></p>

                        <label for="email" class="form-label">Correo</label>
                        <input id="email" name="email" class="form-control" type="text"
                            placeholder="Pedrito@example.com">
                        <p id="error2" class="text-danger"></p>

                        <label for="age" class="form-label">Edad</label>
                        <input id="age" name="age" class="form-control" type="number" min="0" max="120"
                            placeholder="25">
                        <p id="error3" class="text-danger"></p>

                        <button class="btn btn-outline-primary mt-2">Registrarme</button>
                    </form>
                </div>
            </div>
            <div class="row mt-3">
                <div class="col-md-12">
                    <div class="alert"></div>
                </div>
            </div>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
