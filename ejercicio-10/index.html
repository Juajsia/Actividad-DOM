<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 10</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <main>

        <div class="container">
            <div class="row mt-3">
                <div
                    class="col-md-2 bg-body-secondary d-flex flex-column align-items-center text-center border border-2">
                    <div id="red" class="mt-3"
                        style="width: 50px; height: 50px; border-radius: 50%; background-color: #450606;">
                    </div>
                    <div id="yellow" class="mt-3"
                        style="width: 50px; height: 50px; border-radius: 50%; background-color: #5d5d03;">
                    </div>
                    <div id="green" class="my-3"
                        style="width: 50px; height: 50px; border-radius: 50%; background-color: #083b08;">
                    </div>

                    <p></p>
                </div>
            </div>
            <div class="row mt-3">
                <div class="col-md-12">
                    <button class="btn btn-outline-danger">Rojo</button>
                    <button class="btn btn-outline-warning">Amarillo</button>
                    <button class="btn btn-outline-success">Verde</button>
                </div>
            </div>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
