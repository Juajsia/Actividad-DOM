<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 9</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <main>
        <div class="container">
            <div class="row m-2">
                <div class="col-md-6">
                    <form action="">
                        <label class="form-label" for="name">Nombre</label>
                        <input class="form-control" type="text" id="name">

                        <label class="form-label" for="profesion">Profesion</label>
                        <input class="form-control" type="text" id="profesion">

                        <label class="form-label" for="img">Img</label>
                        <input class="form-control" type="text" id="img">

                        <button class="btn btn-primary mt-2">Actualizar Card</button>
                    </form>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6">
                    <div class="card">
                        <img class="card-img-top"
                            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQhGfa-odO48kreEEVLpdv7-QOFBmvRUYHgas5WTMFMdGh5S9ydr2v7Y_M&s=10"
                            alt="">

                        <div class="card-body">
                            <h2 class="card-title">Pedrito</h2>
                            <p class="card-text">Desarollador Fullstack</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
