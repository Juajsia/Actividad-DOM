<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 6</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <div class="container mt-5">
        <h1>Calculadora de IMC</h1>

        <div class="row g-3">
            <div class="col-md-6">
                <form id="form" action="">
                    <label class="form-label" for="weight">Peso (kg)</label>
                    <input id="weight" class="form-control" type="number" placeholder="Escribe tu peso" step="0.01"
                        required>
                    <label class="form-label" for="height">Altura (m)</label>
                    <input id="height" class="form-control" type="number" placeholder="Escribe tu altura" step="0.01"
                        required>
                    <button class="btn btn-primary mt-2">Calcular IMC</button>
                </form>
            </div>
            <div class="row g-3 mt-3">
                <div class="col-md-6">
                    <h2>IMC: <span id="imc" class="p-2 rounded"></span></h2>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
